<!doctype html>
<html lang="it">

<head>
  <meta charset="utf-8">
  <title>Media Manager</title>

  <style>
    body {
      font-family: Arial;
      background: #f6f6f7;
      padding: 30px;
    }

    .product {
      background: #fff;
      padding: 20px;
      margin-bottom: 20px;
      border-radius: 10px;
    }

    .images {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .images img {
      width: 120px;
      height: 120px;
      object-fit: cover;
      border-radius: 8px;
    }

    button {
      margin-top: 5px;
      display: block;
    }
  </style>
</head>

<body>

  <h1>Media Manager</h1>

  <div id="products"></div>

  <script>
    const shop = "6uxkvv-2d.myshopify.com"

    async function loadProducts() {
      const res = await fetch(`/products?shop=${shop}`)
      const products = await res.json()

      const container = document.getElementById("products")
      container.innerHTML = ""

      products.forEach(p => {
        const div = document.createElement("div")
        div.className = "product"

        div.innerHTML = `
      <h2>${p.title}</h2>

      <input type="file" onchange="upload('${p.id}', this.files)">

      <div class="images">
        ${p.images.map(img => `
          <div>
            <img src="${img.url}">
            <button onclick="deleteImg('${p.id}','${img.id}')">Elimina</button>
          </div>
        `).join("")}
      </div>
    `

        container.appendChild(div)
      })
    }

    async function upload(productId, files) {
      for (const file of files) {
        const form = new FormData()
        form.append("shop", shop)
        form.append("product_id", productId)
        form.append("file", file)

        await fetch("/upload-product-image", {
          method: "POST",
          body: form
        })
      }

      await loadProducts()
    }

    async function deleteImg(productId, mediaId) {
      await fetch("/product/media/delete", {
        method: "POST",
        body: new URLSearchParams({
          shop,
          product_id: productId,
          media_id: mediaId
        })
      })

      await loadProducts()
    }

    loadProducts()
  </script>

</body>

</html>
