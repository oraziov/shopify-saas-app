<!doctype html>
<html lang="it">

<head>
  <meta charset="utf-8">
  <title>Media Manager</title>
</head>

<body>

  <h1>Media Manager</h1>

  <input placeholder="Cerca..." oninput="searchProducts(this.value)">

  <h2>CSV</h2>
  <input type="file" id="csv">
  <button onclick="uploadCSV()">Upload CSV</button>

  <hr>

  <div id="products"></div>

  <script>
    const shop = "6uxkvv-2d.myshopify.com"

    async function loadProducts(q = "") {
      const res = await fetch(`/products?shop=${shop}&query=${q}`)
      const data = await res.json()

      const container = document.getElementById("products")
      container.innerHTML = ""

      data.forEach(p => {
        const div = document.createElement("div")

        div.innerHTML = `
      <h3>${p.title}</h3>

      ${p.images.map(img => `
        <img src="${img.url}" width="80"
        onclick="setVariant('${p.variants[0]?.id}','${img.id}')">
      `).join("")}
    `

        container.appendChild(div)
      })
    }

    async function setVariant(variantId, imageId) {
      await fetch("/variant/image/set", {
        method: "POST",
        body: new URLSearchParams({
          shop,
          variant_id: variantId,
          image_id: imageId
        })
      })

      alert("OK")
    }

    async function uploadCSV() {
      const file = document.getElementById("csv").files[0]

      const form = new FormData()
      form.append("shop", shop)
      form.append("file", file)

      await fetch("/csv/upload", {
        method: "POST",
        body: form
      })

      alert("CSV caricato")
    }

    function searchProducts(q) {
      loadProducts(q)
    }

    loadProducts()
  </script>

</body>

</html>
