<!doctype html>
<html>

<head>
  <meta charset="utf-8">
  <title>CSV Manager</title>

  <style>
    body {
      font-family: Arial;
      padding: 30px;
      background: #f6f6f7;
    }

    .card {
      background: white;
      padding: 20px;
      margin-bottom: 20px;
      border-radius: 10px;
    }

    img {
      width: 80px;
      margin: 5px;
      border-radius: 6px;
      cursor: pointer;
      border: 2px solid transparent;
    }

    img.selected {
      border: 2px solid green;
    }
  </style>
</head>

<body>

  <h1>CSV → Associazione immagini</h1>

  <input type="file" id="csv">
  <button id="btnCsv">Carica CSV</button>

  <div id="status"></div>
  <div id="results"></div>

  <script>
    const shop = "6uxkvv-2d.myshopify.com"

    // 🔥 BOTTONE FIXATO
    document.getElementById("btnCsv").addEventListener("click", uploadCSV)

    async function uploadCSV() {
      alert("CLICK OK")

      const file = document.getElementById("csv").files[0]

      if (!file) {
        alert("Seleziona file")
        return
      }

      document.getElementById("status").innerText = "Caricamento..."

      const form = new FormData()
      form.append("shop", shop)
      form.append("file", file)

      try {
        const res = await fetch("/csv/process", {
          method: "POST",
          body: form
        })

        alert("STATUS: " + res.status)

        const data = await res.json()

        alert("Righe trovate: " + data.length)

        render(data)

      } catch (e) {
        alert("Errore: " + e)
      }
    }

    function render(data) {
      const container = document.getElementById("results")
      container.innerHTML = ""

      data.forEach(item => {
        const div = document.createElement("div")
        div.className = "card"

        div.innerHTML = `
      <h2>${item.title}</h2>
      <p><b>Variante:</b> ${item.variant_title}</p>
      <p><b>Color:</b> ${item.color_code}</p>

      <h4>Shopify</h4>
      ${item.images_shopify.map(i => `<img src="${i.url}">`).join("")}

      <h4>CSV (clicca)</h4>
      <div class="csv">
        ${item.images_csv.map(i => `<img src="${i}" onclick="toggle(this)">`).join("")}
      </div>

      <button onclick='send(${JSON.stringify(item).replace(/'/g, "&apos;")})'>
        Associa immagini
      </button>
    `

        container.appendChild(div)
      })
    }

    function toggle(el) {
      el.classList.toggle("selected")
    }

    async function send(item) {
      const selected = Array.from(
        event.target.parentElement.querySelectorAll(".csv img.selected")
      ).map(i => i.src)

      if (!selected.length) {
        alert("Seleziona immagini")
        return
      }

      const form = new URLSearchParams()
      form.append("shop", shop)
      form.append("product_id", item.product_id)
      form.append("variant_id", item.variant_id)
      form.append("images", JSON.stringify(selected))

      await fetch("/images/assign", {
        method: "POST",
        body: form
      })

      alert("OK immagini associate")
    }
  </script>

</body>

</html>
