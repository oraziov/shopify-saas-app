<!doctype html>
<html>

<head>
  <meta charset="utf-8">
  <title>CSV Image Manager</title>

  <style>
    body {
      font-family: Arial;
      padding: 30px;
      background: #f6f6f7;
    }

    .card {
      background: white;
      padding: 20px;
      margin-bottom: 20px;
      border-radius: 10px;
    }

    img {
      width: 80px;
      margin: 5px;
      border-radius: 6px;
      cursor: pointer;
      border: 2px solid transparent;
    }

    img.selected {
      border: 2px solid green;
    }
  </style>
</head>

<body>

  <h1>Import CSV + Associazione immagini</h1>

  <input type="file" id="csv">
  <button onclick="uploadCSV()">Carica CSV</button>

  <div id="results"></div>

  <script>
    const shop = "6uxkvv-2d.myshopify.com"

    async function uploadCSV() {
      const file = document.getElementById("csv").files[0]

      const form = new FormData()
      form.append("shop", shop)
      form.append("file", file)

      const res = await fetch("/csv/process", {
        method: "POST",
        body: form
      })

      const data = await res.json()
      render(data)
    }

    function render(data) {
      const container = document.getElementById("results")
      container.innerHTML = ""

      data.forEach(item => {
        const div = document.createElement("div")
        div.className = "card"

        div.innerHTML = `
      <h2>${item.title}</h2>
      <p><b>Variante:</b> ${item.variant_title}</p>
      <p><b>Color Code:</b> ${item.color_code}</p>

      <h4>Shopify</h4>
      ${item.images_shopify.map(i => `<img src="${i.url}">`).join("")}

      <h4>CSV (clicca per selezionare)</h4>
      <div class="csv-images">
        ${item.images_csv.filter(Boolean).map(i => `
          <img src="${i}" onclick="toggle(this)">
        `).join("")}
      </div>

      <button onclick="send('${item.product_id}','${item.variant_id}', this)">
        Associa immagini selezionate
      </button>
    `

        container.appendChild(div)
      })
    }

    function toggle(el) {
      el.classList.toggle("selected")
    }

    async function send(productId, variantId, btn) {
      const images = Array.from(
        btn.parentElement.querySelectorAll(".csv-images img.selected")
      ).map(img => img.src)

      if (!images.length) {
        alert("Seleziona immagini")
        return
      }

      const form = new URLSearchParams()
      form.append("shop", shop)
      form.append("product_id", productId)
      form.append("variant_id", variantId)
      form.append("images", JSON.stringify(images))

      await fetch("/images/assign", {
        method: "POST",
        body: form
      })

      alert("Immagini associate ✅")
    }
  </script>

</body>

</html>
